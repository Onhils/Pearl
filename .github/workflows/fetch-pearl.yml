name: Fetch Pearl data

on:
  schedule:
    - cron: '*/5 * * * *'   # každých 5 minut
  workflow_dispatch:          # možnost spustit ručně

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stáhnout data z pearlhash API
        run: |
          curl -sf \
            "https://pearlhash.xyz/api/account/prl1pzdky20xjrduj08apwl4xke3fsjfkleaujx754d6jrpks9zgr5q4q97s0uy" \
            -o data.json
          echo "Staženo $(wc -c < data.json) bytů"

      - name: Commitnout data.json pokud se změnil
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
